<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="vendor/gsap.min.js"></script>
<style>
  /* Belarmino Agency — "Anúncio ou conteúdo?" (versão original; perfil principal: azul elétrico) */
  @font-face { font-family: "InterApoio"; src: url("fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "InterChave"; src: url("fonts/InterDisplay-Black.otf"); font-weight: 900; }
  :root { --branco:#FFFFFF; --azul:#2F5BFF; --azulc:#6E8BFF; --fundo:#0B0B0F; --cinza:rgba(255,255,255,.55); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--fundo); }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"InterApoio"; color:var(--branco); background:var(--fundo); }
  #luz { position:absolute; left:-300px; top:200px; width:1700px; height:1700px; border-radius:50%;
         background:radial-gradient(closest-side, rgba(47,91,255,.22), rgba(47,91,255,0)); }
  .cena { position:absolute; inset:0; visibility:hidden; }
  #c2 { transform:translateY(-60px) scale(1.08); transform-origin:50% 50%; }
  #linhaPausa, #pausa, .post, .tag { opacity:0; }
  .chave { font-family:"InterChave"; font-weight:900; letter-spacing:-0.03em; }
  .w { display:inline-block; }

  /* cena 1 */
  #c1 .titulo { position:absolute; left:120px; right:120px; top:640px; font-size:136px; line-height:.98; }
  #c1 .azul { color:var(--azul); }

  /* cena 2: gráfico */
  #legenda2 { position:absolute; left:110px; top:430px; display:flex; gap:44px; font-size:38px; }
  #legenda2 .item { display:flex; align-items:center; gap:14px; }
  #legenda2 .bola { width:22px; height:22px; border-radius:50%; }
  #titulo2 { position:absolute; left:110px; top:300px; font-size:64px; }
  svg#grafico { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:visible; }
  #eixoTxt { position:absolute; left:110px; top:1372px; width:860px; display:flex; justify-content:space-between; font-size:30px; color:var(--cinza); }
  #pausa { position:absolute; top:560px; font-size:32px; padding:10px 18px; border-radius:14px; background:rgba(255,255,255,.08);
           border:2px dashed rgba(255,255,255,.45); white-space:nowrap; transform:translateX(-50%); }
  .post { position:absolute; width:46px; height:46px; margin:-64px 0 0 -23px; border-radius:11px; background:var(--azul);
          box-shadow:0 0 20px rgba(47,91,255,.8); display:flex; align-items:center; justify-content:center; }
  .post svg { width:28px; height:28px; fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .tag { position:absolute; font-family:"InterChave"; font-size:40px; white-space:nowrap; }
  #tagAz { color:var(--azulc); } #tagBr { color:var(--branco); }

  /* cena 3 */
  #c3 .bloco { position:absolute; left:120px; right:120px; top:560px; }
  #c3 .l1 { font-size:108px; line-height:1.02; }
  #c3 .l2 { font-size:108px; line-height:1.02; color:var(--azul); margin-top:12px; }
  #c3 .l3 { font-size:50px; margin-top:60px; color:var(--cinza); }
  #c3 .l3 b { color:var(--branco); font-family:"InterChave"; font-weight:900; }

  /* cena 4 */
  #logo { position:absolute; left:50%; top:560px; width:340px; margin-left:-170px; filter:drop-shadow(0 0 40px rgba(47,91,255,.55)); }
  #arroba { position:absolute; left:0; right:0; top:1000px; text-align:center; font-size:66px; }
  #cta4 { position:absolute; left:0; right:0; top:1100px; text-align:center; font-size:40px; color:var(--cinza); }
  #cta4 b { color:var(--azulc); font-family:"InterChave"; font-weight:900; }
</style>
</head>
<body>
<div id="root" class="clip" data-composition-id="main" data-start="0" data-duration="12.9833" data-width="1080" data-height="1920">
  <div id="luz" data-layout-ignore></div>

  <div class="cena" id="c1">
    <div class="titulo chave"><span class="w">Anúncio</span> <span class="w">ou</span><br><span class="w azul">conteúdo?</span></div>
  </div>

  <div class="cena" id="c2">
    <div id="titulo2" class="chave">O que acontece quando…</div>
    <div id="legenda2">
      <div class="item" id="lgBr"><div class="bola" style="background:#fff"></div>Anúncio</div>
      <div class="item" id="lgAz"><div class="bola" style="background:var(--azul);box-shadow:0 0 14px rgba(47,91,255,.9)"></div>Conteúdo</div>
    </div>
    <svg id="grafico" viewBox="0 0 1080 1920">
      <defs><filter id="brilho" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <line id="base" x1="110" y1="1340" x2="970" y2="1340" stroke="rgba(255,255,255,.22)" stroke-width="3"/>
      <line id="linhaPausa" x1="560" y1="640" x2="560" y2="1340" stroke="rgba(255,255,255,.5)" stroke-width="3" stroke-dasharray="14 12"/>
      <path id="pBr" d="" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="pAz" d="" fill="none" stroke="#2F5BFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#brilho)"/>
      <circle id="dBr" r="15" fill="#fff"/>
      <circle id="dAz" r="17" fill="#2F5BFF" stroke="#fff" stroke-width="5"/>
    </svg>
    <div id="pausa" style="left:560px">Pausou o investimento</div>
    <div id="posts"></div>
    <div class="tag" id="tagBr">Anúncio</div>
    <div class="tag" id="tagAz">Conteúdo</div>
    <div id="eixoTxt"><span>começo</span><span>tempo →</span></div>
  </div>

  <div class="cena" id="c3">
    <div class="bloco">
      <div class="l1 chave"><span class="w">Anúncio</span> <span class="w">acelera.</span></div>
      <div class="l2 chave"><span class="w">Conteúdo</span> <span class="w">acumula.</span></div>
      <div class="l3"><span class="w">O jogo é</span> <span class="w"><b>usar os dois.</b></span></div>
    </div>
  </div>

  <div class="cena" id="c4">
    <img id="logo" src="assets/belarmino_b.png" alt="Belarmino Agency" />
    <div id="arroba" class="chave">@belarminoagency</div>
    <div id="cta4">Segue pra <b>crescer com estratégia</b></div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;
  const FIM = 12.9833;
  const F = (o) => Object.assign({ immediateRender: false, lazy: false }, o);
  const mostra = (id, a, b) => { tl.set("#" + id, { visibility: "visible" }, a); tl.set("#" + id, { visibility: "hidden" }, b); };
  const entra = (sel, t, de, dur) => tl.fromTo(sel, Object.assign({ opacity: 0, y: 40, filter: "blur(12px)" }, de || {}),
                   F({ opacity: 1, x: 0, y: 0, scale: 1, filter: "blur(0px)", duration: dur || 0.45, ease: "expo.out" }), t);
  const sai = (sel, t) => tl.fromTo(sel, { opacity: 1, y: 0, filter: "blur(0px)" }, F({ opacity: 0, y: -40, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }), t);

  // ---------- dados do gráfico (coordenadas do quadro) ----------
  const X0 = 110, X1 = 970, BASE = 1340, XP = 560;
  // anúncio: dispara, fica alto enquanto há investimento, despenca na pausa
  const br = [[110,1340],[150,1150],[200,900],[260,790],[330,770],[400,782],[470,768],[530,776],[560,772],[585,1020],[615,1240],[650,1300],[720,1316],[850,1322],[970,1324]];
  // conteúdo: degraus (cada post soma ao anterior) e termina acima
  const az = [[110,1330]]; const passos = 8, larg = (X1 - X0) / passos;
  let y = 1330; const degraus = [];
  for (let i = 0; i < passos; i++) {
    const x = X0 + larg * (i + 1);
    az.push([x - 18, y]); const yn = y - (i < 3 ? 58 : 92); az.push([x, yn]); degraus.push([x, yn]); y = yn;
  }
  function ate(pts, x) {
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      if (bx <= x) { out.push(pts[i]); continue; }
      if (ax < x) { const k = (x - ax) / (bx - ax); out.push([x, ay + (by - ay) * k]); }
      break;
    }
    return out;
  }
  const dStr = (p) => "M" + p.map((q) => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L");
  const est = { x: X0 };
  const pBr = document.getElementById("pBr"), pAz = document.getElementById("pAz");
  const dBr = document.getElementById("dBr"), dAz = document.getElementById("dAz");
  function desenha() {
    const a = ate(br, est.x), b = ate(az, est.x);
    pBr.setAttribute("d", dStr(a)); pAz.setAttribute("d", dStr(b));
    const ua = a[a.length - 1], ub = b[b.length - 1];
    dBr.setAttribute("cx", ua[0]); dBr.setAttribute("cy", ua[1]); dAz.setAttribute("cx", ub[0]); dAz.setAttribute("cy", ub[1]);
  }
  // posts nos degraus
  const postsEl = document.getElementById("posts");
  degraus.forEach(([x, yy]) => {
    const p = document.createElement("div"); p.className = "post"; p.style.left = x + "px"; p.style.top = yy + "px";
    p.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>';
    postsEl.appendChild(p);
  });
  desenha();

  function montar() {
    // ---------- cena 1: pergunta (0–1,5) ----------
    mostra("c1", 0, 1.55);
    [...document.querySelectorAll("#c1 .w")].forEach((w, i) => entra(w, 0.12 + i * 0.26, { y: 60, scale: 0.9 }, 0.5));
    tl.fromTo("#c1 .azul", { scale: 1 }, F({ scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }), 0.75);
    sai("#c1 .titulo", 1.25);

    // ---------- cena 2: gráfico (1,5–7,0) ----------
    const T0 = 1.95, T1 = 6.35, vx = (X1 - X0) / (T1 - T0);
    const tX = (x) => T0 + (x - X0) / vx;
    mostra("c2", 1.5, 7.0);
    entra("#titulo2", 1.5); entra("#lgBr", 1.6, { x: -30 }); entra("#lgAz", 1.7, { x: -30 });
    tl.fromTo("#base", { attr: { x2: X0 } }, F({ attr: { x2: X1 }, duration: 0.5, ease: "power3.out" }), 1.6);
    entra("#eixoTxt", 1.75, { y: 20 });
    tl.set(["#pBr", "#pAz", "#dBr", "#dAz"], { opacity: 1 }, 0);
    tl.fromTo(est, { x: X0 }, F({ x: X1, duration: T1 - T0, ease: "none", onUpdate: desenha }), T0);
    tl.fromTo("#linhaPausa", { opacity: 0, attr: { y1: BASE } }, F({ opacity: 1, attr: { y1: 640 }, duration: 0.35, ease: "power3.out" }), tX(XP) - 0.15);
    entra("#pausa", tX(XP) - 0.05, { y: -20, scale: 0.85 });
    tl.fromTo("#pBr", { opacity: 1 }, F({ opacity: 0.55, duration: 0.4, ease: "power1.inOut" }), tX(650));
    [...document.querySelectorAll(".post")].forEach((p, i) => {
      const t = tX(degraus[i][0]);
      tl.fromTo(p, { opacity: 0, scale: 0, y: 20 }, F({ opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2.2)" }), t);
    });
    // etiquetas no fim das linhas
    tl.set("#tagAz", { left: X1 - 340, top: degraus[passos - 1][1] - 40 }, 0);
    tl.set("#tagBr", { left: X1 - 190, top: 1240 }, 0);
    entra("#tagAz", T1 + 0.05, { x: 20 }); entra("#tagBr", T1 + 0.15, { x: 20 });
    tl.fromTo("#dAz", { attr: { r: 17 } }, F({ attr: { r: 24 }, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }), T1);
    sai(["#titulo2", "#legenda2", "#grafico", "#pausa", "#posts", "#tagAz", "#tagBr", "#eixoTxt"], 6.7);

    // ---------- cena 3: frases (7,0–10,0) ----------
    mostra("c3", 7.0, 10.05);
    const ws3 = [...document.querySelectorAll("#c3 .w")];
    [7.1, 7.35, 7.8, 8.05, 8.75, 8.95].forEach((t, i) => entra(ws3[i], t, { y: 50 }, 0.45));
    tl.fromTo("#c3 .l2", { scale: 1 }, F({ scale: 1.04, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 50%" }), 8.1);
    sai("#c3 .bloco", 9.7);

    // ---------- cena 4: marca (10,0–fim) ----------
    mostra("c4", 10.0, FIM);
    tl.set("#logo", { transformOrigin: "50% 55%" }, 10.0);
    tl.fromTo("#logo", { opacity: 0, scale: 0.35, rotation: -120, filter: "blur(14px) drop-shadow(0 0 40px rgba(47,91,255,.55))" },
      F({ opacity: 1, scale: 1, rotation: 0, filter: "blur(0px) drop-shadow(0 0 40px rgba(47,91,255,.55))", duration: 0.7, ease: "back.out(1.6)" }), 10.05);
    tl.fromTo("#logo", { y: 0 }, F({ y: -12, duration: 2.2, ease: "sine.inOut" }), 10.8);
    entra("#arroba", 10.6, { y: 40 }, 0.5);
    entra("#cta4", 11.0, { y: 30 }, 0.5);
    // luz de fundo: deriva lenta o vídeo todo
    tl.fromTo("#luz", { x: 0, y: 0 }, F({ x: 260, y: -180, duration: FIM, ease: "none" }), 0);
    tl.set({}, {}, FIM);
    tl.seek(0);
  }
  document.fonts.ready.then(montar);
</script>
</body>
</html>
