<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="vendor/gsap.min.js"></script>
<style>
  /* Camada "frente": tras = entre a parede e a pessoa (a pessoa recortada vai por cima); frente = por cima da pessoa */
  @font-face { font-family: "InterApoio"; src: url("fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "InterChave"; src: url("fonts/InterDisplay-Black.otf"); font-weight: 900; }
  :root { --branco:#FFFFFF; --azul:#2F5BFF; --azulc:#6E8BFF; --fundo:#0B0B0F;
          --card: rgba(11,11,15,.88); --borda: rgba(255,255,255,.16); --sombra: 0 18px 50px rgba(0,0,0,.55); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { position:relative; width:1080px; height:1920px; font-family:"InterApoio"; color:var(--branco); }
  .mo { position:absolute; inset:0; visibility:hidden; }
  .card { background:var(--card); border:2px solid var(--borda); border-radius:28px; box-shadow:var(--sombra); }
  svg.ic { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .rot { font-size:30px; text-shadow:0 3px 12px rgba(0,0,0,.6); white-space:nowrap; }
  /* mo01: barras saindo de trás dos ombros */
  .barra { position:absolute; top:1000px; width:150px; display:flex; flex-direction:column; align-items:center; }
  #b-voce { left:60px; } #b-ele { left:905px; width:130px; }
  .barra .tit { display:flex; gap:8px; align-items:center; font-family:"InterChave"; font-size:34px; margin-bottom:12px; text-shadow:0 3px 14px rgba(0,0,0,.6); }
  .barra .corpo { width:100%; height:1400px; border-radius:22px 22px 0 0; }
  #b-voce .corpo { background:linear-gradient(180deg,#fff,#cfd6ff 30%); box-shadow:0 0 30px rgba(255,255,255,.35); }
  #b-ele .corpo { background:linear-gradient(180deg,var(--azulc),var(--azul) 30%); box-shadow:0 0 40px rgba(47,91,255,.8); }
  /* mo02: selos em volta da cabeça */
  .selo { position:absolute; width:170px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .selo .bola { position:relative; width:150px; height:150px; border-radius:50%; background:var(--card); border:2px solid var(--borda);
                display:flex; align-items:center; justify-content:center; font-size:66px; color:var(--branco); box-shadow:var(--sombra); }
  .selo .ok { position:absolute; right:-6px; bottom:-6px; width:56px; height:56px; border-radius:50%; background:var(--azul); color:#fff;
              display:flex; align-items:center; justify-content:center; font-size:34px; }
  .selo .ok svg { stroke-width:3; }
  #s1 { left:50px; top:440px; } #s2 { left:50px; top:800px; } #s3 { left:900px; top:600px; width:160px; }
  #s3 .bola { width:136px; height:136px; font-size:58px; }
  #olho { position:absolute; left:390px; top:40px; width:300px; height:300px; border-radius:50%; background:var(--branco); color:var(--fundo);
          display:flex; align-items:center; justify-content:center; font-size:170px; box-shadow:0 0 60px rgba(0,0,0,.5); }
  /* mo03: dias em arco */
  .dia { position:absolute; width:100px; height:124px; margin:-62px 0 0 -50px; border-radius:20px; background:var(--card); border:2px solid var(--borda);
         display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:12px 0 14px; overflow:hidden; box-shadow:var(--sombra); }
  .dia .let { font-family:"InterChave"; font-size:32px; z-index:2; }
  .dia .post { font-size:40px; z-index:2; opacity:.35; }
  .dia .luz { position:absolute; inset:0; background:var(--azul); transform-origin:50% 100%; transform:scaleY(0); z-index:1; }
  /* mo04: posts dos lados */
  .tile { position:absolute; width:170px; height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .tile svg { font-size:70px; } .tile .rot { font-size:28px; }
  .tile.fim svg { color:var(--azulc); }
  #t1 { left:50px; top:430px; } #t2 { left:895px; top:430px; width:160px; height:160px; } #t3 { left:50px; top:800px; } #t4 { left:895px; top:800px; width:160px; height:160px; }
  /* mo05: 1º gigante atrás (tras) + busca no peito (frente) */
  #primeiro { position:absolute; left:130px; top:-40px; font-family:"InterChave"; font-size:600px; line-height:1; color:var(--branco); letter-spacing:-0.06em;
              text-shadow:0 0 50px rgba(47,91,255,.95), 0 0 120px rgba(47,91,255,.6); }
  #primeiro sup { font-size:.4em; vertical-align:top; position:relative; top:.2em; color:var(--azul); text-shadow:0 0 30px rgba(255,255,255,.4); }
  #busca { position:absolute; left:160px; top:1150px; display:flex; align-items:center; gap:20px; width:760px; height:104px; padding:0 34px; border-radius:60px; font-size:40px; }
  #busca svg { font-size:44px; color:var(--azulc); }
  #busca .cur { width:3px; height:46px; background:var(--branco); margin-left:2px; }
  /* mo06: PRESENÇA na parede */
  #sombra06 { position:absolute; inset:0; background:radial-gradient(70% 45% at 50% 18%, rgba(11,11,15,.55), rgba(11,11,15,.85)); }
  #palavra06 { position:absolute; left:0; width:1080px; top:90px; text-align:center; font-family:"InterChave"; font-size:178px; letter-spacing:-0.035em; }
  #palavra06 .brilho { position:absolute; inset:0; color:var(--azul); filter:blur(30px); }
  #palavra06 .letras { position:relative; color:var(--branco); }
  #palavra06 .l { display:inline-block; }
  /* mo07: chamada (frente) */
  #cta { position:absolute; left:50%; top:200px; display:flex; align-items:center; gap:18px; background:var(--branco); color:var(--fundo); border-radius:60px;
         padding:22px 40px 22px 30px; font-family:"InterChave"; font-size:44px; white-space:nowrap; box-shadow:0 14px 44px rgba(0,0,0,.45); }
  #cta svg { font-size:46px; color:var(--azul); stroke-width:2.6; }
  [data-camada]:not([data-camada="frente"]) { display:none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-package" viewBox="0 0 24 24"><path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M7 11.5V6a1.5 1.5 0 0 1 3 0v4"/><path d="M10 10V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M13 10V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M16 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.15L4 15.5a1.6 1.6 0 0 1 2.4-2.1L8 15"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-clap" viewBox="0 0 24 24"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
</svg>
<div id="root" class="clip" data-composition-id="main" data-start="0" data-duration="37.3167" data-width="1080" data-height="1920">
  <div class="mo" id="mo01" data-camada="tras">
    <div class="barra" id="b-voce"><div class="tit"><svg class="ic"><use href="#i-star"/></svg>VOCÊ</div><div class="corpo"></div></div>
    <div class="barra" id="b-ele"><div class="tit"><svg class="ic"><use href="#i-eye"/></svg>ELE</div><div class="corpo"></div></div>
  </div>
  <div class="mo" id="mo02" data-camada="tras">
    <div class="selo" id="s1"><div class="bola"><svg class="ic"><use href="#i-package"/></svg><div class="ok"><svg class="ic"><use href="#i-check"/></svg></div></div><div class="rot">Produto</div></div>
    <div class="selo" id="s2"><div class="bola"><svg class="ic"><use href="#i-hand"/></svg><div class="ok"><svg class="ic"><use href="#i-check"/></svg></div></div><div class="rot">Atendimento</div></div>
    <div class="selo" id="s3"><div class="bola"><svg class="ic"><use href="#i-users"/></svg><div class="ok"><svg class="ic"><use href="#i-check"/></svg></div></div><div class="rot">Clientes</div></div>
    <div id="olho"><svg class="ic"><use href="#i-eyeoff"/></svg></div>
  </div>
  <div class="mo" id="mo03" data-camada="tras"></div>
  <div class="mo" id="mo04" data-camada="tras">
    <div class="tile card" id="t1"><svg class="ic"><use href="#i-package"/></svg><div class="rot">produto</div></div>
    <div class="tile card" id="t2"><svg class="ic"><use href="#i-users"/></svg><div class="rot">clientes</div></div>
    <div class="tile card" id="t3"><svg class="ic"><use href="#i-clap"/></svg><div class="rot">bastidores</div></div>
    <div class="tile card fim" id="t4"><svg class="ic"><use href="#i-trend"/></svg><div class="rot">resultados</div></div>
  </div>
  <div class="mo" id="mo05t" data-camada="tras"><div id="primeiro">1<sup>º</sup></div></div>
  <div class="mo" id="mo05f" data-camada="frente"><div class="card" id="busca"><svg class="ic"><use href="#i-search"/></svg><span id="digita"></span><div class="cur"></div></div></div>
  <div class="mo" id="mo06" data-camada="tras"><div id="sombra06"></div><div id="palavra06"><div class="brilho" data-layout-ignore>PRESENÇA</div><div class="letras" id="letras"></div></div></div>
  <div class="mo" id="mo07" data-camada="frente"><div id="cta"><svg class="ic"><use href="#i-bookmark"/></svg>Salva pra lembrar</div></div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;
  const CAMADA = "frente", FIM = 37.3167;
  const F = (o) => Object.assign({ immediateRender: false, lazy: false }, o);
  const ativo = (id) => document.getElementById(id).dataset.camada === CAMADA;
  const mostra = (id, a, b) => { if (!ativo(id)) return false; tl.set("#" + id, { visibility: "visible" }, a); tl.set("#" + id, { visibility: "hidden" }, b); return true; };
  const entra = (sel, t, de) => tl.fromTo(sel, Object.assign({ opacity: 0, scale: 0.85, x: 0, y: 30, filter: "blur(10px)" }, de || {}),
                    F({ opacity: 1, scale: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.5)" }), t);
  const sai = (sel, t) => tl.fromTo(sel, { opacity: 1, filter: "blur(0px)" }, F({ opacity: 0, filter: "blur(12px)", duration: 0.25, ease: "power3.in" }), t);

  const m3 = document.getElementById("mo03");
  ["D","S","T","Q","Q","S","S"].forEach((l, i) => {
    const ang = (-155 + i * (130 / 6)) * Math.PI / 180;
    const e = document.createElement("div"); e.className = "dia";
    e.style.left = (540 + 471 * Math.cos(ang)) + "px"; e.style.top = (760 + 520 * Math.sin(ang)) + "px";
    e.innerHTML = '<div class="luz"></div><div class="let">' + l + '</div><svg class="ic post"><use href="#i-image"/></svg>';
    m3.appendChild(e);
  });
  const letras = document.getElementById("letras");
  [..."PRESENÇA"].forEach((c) => { const s = document.createElement("span"); s.className = "l"; s.textContent = c; letras.appendChild(s); });

  function montar() {
    // mo01 (tras): barras sobem de trás dos ombros (o topo da barra é a "altura")
    if (mostra("mo01", 0.53, 4.46)) {
      tl.set(["#b-voce", "#b-ele"], { y: 300 }, 0);
      tl.fromTo("#b-voce", { y: 300 }, F({ y: -120, duration: 0.6, ease: "power3.out" }), 0.53);
      tl.fromTo("#b-ele", { y: 300 }, F({ y: 20, duration: 0.6, ease: "power3.out" }), 0.63);
      tl.fromTo("#b-voce", { y: -120 }, F({ y: -420, duration: 0.5, ease: "back.out(1.6)" }), 1.98);
      tl.fromTo("#b-ele", { y: 20 }, F({ y: -900, duration: 0.45, ease: "expo.out" }), 3.50);
      tl.fromTo("#b-voce", { opacity: 1 }, F({ opacity: 0.5, duration: 0.3, ease: "power1.inOut" }), 3.58);
      // saída: cada barra parte da opacidade em que está (a "VOCÊ" está apagada em 0,5; partir de 1 dava um pisca)
      tl.fromTo("#b-voce", { opacity: 0.5, filter: "blur(0px)" }, F({ opacity: 0, filter: "blur(12px)", duration: 0.25, ease: "power3.in" }), 4.19);
      sai("#b-ele", 4.19);
    }
    // mo02 (tras): selos + olho cortado no alto
    if (mostra("mo02", 6.13, 11.24)) {
      tl.set("#olho", { opacity: 0 }, 0);
      [["#s1", 6.31, -60], ["#s2", 7.21, -60], ["#s3", 8.17, 60]].forEach(([s, t, dx]) => {
        entra(s, t, { x: dx, y: 0 });
        tl.fromTo(s + " .ok", { scale: 0, rotation: -30 }, F({ scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)" }), t + 0.18);
      });
      tl.fromTo("#mo02 .selo", { opacity: 1, filter: "grayscale(0)" }, F({ opacity: 0.4, filter: "grayscale(1)", duration: 0.3, ease: "power1.inOut" }), 10.00);
      tl.set("#olho", { transformOrigin: "50% 50%" }, 10.00);
      tl.fromTo("#olho", { opacity: 0, scale: 1.7, rotation: -14 }, F({ opacity: 1, scale: 1, rotation: -6, duration: 0.32, ease: "power4.out" }), 10.00);
      sai(["#mo02 .selo", "#olho"], 10.77);
    }
    // mo03 (tras): coroa de dias
    if (mostra("mo03", 12.17, 14.64)) {
      [...document.querySelectorAll(".dia")].forEach((e, i) => {
        entra(e, 12.17 + i * 0.04, { y: 40, scale: 0.6 });
        const t = 13.45 + i * 0.07;
        tl.fromTo(e.querySelector(".luz"), { scaleY: 0 }, F({ scaleY: 1, duration: 0.25, ease: "power3.out" }), t);
        tl.fromTo(e.querySelector(".post"), { opacity: 0.35, scale: 1 }, F({ opacity: 1, scale: 1.12, duration: 0.25, ease: "back.out(2)" }), t);
      });
      sai(".dia", 14.19);
    }
    // mo04 (tras): posts dos lados
    if (mostra("mo04", 15.37, 19.40)) {
      [["#t1", 15.61, -60], ["#t2", 16.45, 60], ["#t3", 17.47, -60], ["#t4", 18.57, 60]].forEach(([s, t, dx]) => entra(s, t, { x: dx, y: 0, scale: 0.8 }));
      tl.fromTo("#t4 svg", { y: 0 }, F({ y: -10, duration: 0.5, ease: "power2.out" }), 18.72);
      sai("#mo04 .tile", 18.92);
    }
    // mo05: 1º atrás (tras) + busca no peito (frente)
    if (mostra("mo05t", 22.00, 24.86)) {
      tl.set("#primeiro", { transformOrigin: "30% 70%" }, 22.13);
      tl.fromTo("#primeiro", { opacity: 0, scale: 0.6, y: 200, filter: "blur(16px)" }, F({ opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "back.out(1.4)" }), 22.13);
      tl.fromTo("#primeiro", { x: 0 }, F({ x: 18, duration: 1.7, ease: "none" }), 22.68);
      sai("#primeiro", 24.61);
    }
    if (mostra("mo05f", 21.00, 24.86)) {
      entra("#busca", 21.00);
      const txt = "onde comprar…", dig = document.getElementById("digita");
      for (let i = 0; i <= txt.length; i++) tl.set(dig, { textContent: txt.slice(0, i) }, 21.13 + i * (1 / 23));
      tl.fromTo("#busca .cur", { opacity: 1 }, F({ opacity: 0, duration: 0.01, repeat: 7, yoyo: true, repeatDelay: 0.25, ease: "none" }), 21.80);
      sai("#busca", 24.61);
    }
    // mo06 (tras): parede escurece + PRESENÇA
    if (mostra("mo06", 29.82, 31.10)) {
      tl.fromTo("#sombra06", { opacity: 0 }, F({ opacity: 1, duration: 0.25, ease: "power1.inOut" }), 29.82);
      tl.fromTo("#palavra06 .brilho", { opacity: 0 }, F({ opacity: 0.95, duration: 0.5, ease: "power2.out" }), 30.25);
      tl.fromTo("#palavra06", { scale: 1.0 }, F({ scale: 1.05, duration: 1.0, ease: "none" }), 30.07);
      [...letras.children].forEach((l, i) => tl.fromTo(l, { opacity: 0, y: 60, filter: "blur(12px)" }, F({ opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }), 30.07 + i * 0.03));
    }
    // mo07 (frente): chamada
    if (mostra("mo07", 36.17, FIM)) {
      tl.fromTo("#cta", { opacity: 0, scale: 0.7, y: -30, xPercent: -50, filter: "blur(10px)" },
                        F({ opacity: 1, scale: 1, y: 0, xPercent: -50, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.8)" }), 36.17);
      tl.fromTo("#cta svg", { y: -8 }, F({ y: 0, duration: 0.4, ease: "bounce.out" }), 36.47);
    }
    tl.set({}, {}, FIM);
    tl.seek(0);
  }
  document.fonts.ready.then(montar);
</script>
</body>
</html>
